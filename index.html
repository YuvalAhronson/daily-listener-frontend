<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyListener</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h1>Daily Listener</h1>
    <form>
        <label for="day-description-from-user">How was your day?</label>
        <input type="text" id="day-description-from-user" name="day-description"> 
        <button type="submit">Tell me :)</button>
    </form>
    <div id="response-to-day-description"></div>
    
    <script src="index.js"></script> 
</body>
</html>
